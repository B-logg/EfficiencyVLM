model:
  path: "OpenGVLab/InternVL3_5-8B"
  dtype: bfloat16
  trust_remote_code: true
  low_cpu_mem_usage: true

vit:
  image_size: 448
  downsample_ratio: 0.5
  max_num_tiles: 1
  normalize: imagenet

llm:
  do_sample: false
  max_new_tokens: 256
  max_context: 40960  # 실측값 (max_position_embeddings)

seed: 42
device: cuda
clip_duration_sec: 10
